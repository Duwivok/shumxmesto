  </head>
  <body>
    <main class="app" data-app data-page="home" data-ready="false">
      <div class="scene" aria-live="polite">
        <!-- Keeping every screen mounted makes switching instant and flash-free. -->
        <div class="backgrounds" aria-hidden="true">
          <img class="background is-active" data-background="home" src="backgrounds/home.png?v=9d1596f35f" alt="" />
          <img class="background" data-background="lineup" src="backgrounds/lineup.png?v=e0cb8737cd" alt="" />
          <img class="background" data-background="bar" src="backgrounds/bar.png?v=027f2cc6c5" alt="" />
          <img class="background" data-background="rsvp" src="backgrounds/rsvp.png?v=6c1d899676" alt="" />
          <img class="background" data-background="geo" src="cat.jpg?v=919838aa23" alt="" />
        </div>

        <div class="timer-system" data-countdown data-effects="on" role="timer" aria-live="off">
          <video
            class="timer-screen-backgrounds"
            data-timer-background-video
            data-src="timer-backgrounds-v1/web/timer-backgrounds.webm"
            poster="timer-backgrounds-v1/preview/poster-all.png"
            preload="auto"
            autoplay
            loop
            muted
            playsinline
            webkit-playsinline
            disablepictureinpicture
            aria-hidden="true"
          ></video>
          <svg class="timer-filter-definitions" aria-hidden="true" width="0" height="0" focusable="false">
            <defs>
              <filter id="timer-screen-spill" filterUnits="userSpaceOnUse" x="0" y="0" width="390" height="240" color-interpolation-filters="sRGB">
                <!-- Both reflections come from the same live video/WebP frame. -->
                <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="diffuse" />
                <feComponentTransfer in="diffuse" result="interior-light">
                  <feFuncA type="linear" slope="2.4" />
                </feComponentTransfer>
                <feImage data-timer-glow-mask x="0" y="0" width="390" height="240" preserveAspectRatio="none" result="screen-mask" />
                <!-- Leave a small inner margin for antialiasing at narrow sizes. -->
                <feMorphology in="screen-mask" operator="erode" radius="1" result="inset-mask" />
                <feComposite in="interior-light" in2="inset-mask" operator="in" result="screen-light" />
                <feMerge>
                  <feMergeNode in="SourceGraphic" />
                  <feMergeNode in="screen-light" />
                </feMerge>
              </filter>
              <filter id="timer-digit-light" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB">
                <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur" />
                <feComponentTransfer in="blur" result="light">
                  <feFuncA type="linear" slope="0.45" />
                </feComponentTransfer>
                <feBlend in="light" in2="SourceGraphic" mode="screen" />
              </filter>
            </defs>
          </svg>
          <div class="timer-screen" data-timer-screen="days" aria-label="00 дней">
            <div class="timer-screen-clip" data-timer-clip>
              <div class="timer-surface" data-timer-surface>
                <div class="timer-digits" aria-hidden="true">
                  <span class="timer-digit"><img data-timer-digit alt="" draggable="false" /></span>
                  <span class="timer-digit"><img data-timer-digit alt="" draggable="false" /></span>
                </div>
                <img class="timer-word" data-timer-word alt="" draggable="false" aria-hidden="true" />
              </div>
            </div>
            <img class="timer-glass" data-timer-glass alt="" draggable="false" />
          </div>

          <div class="timer-screen" data-timer-screen="hours" aria-label="00 часов">
            <div class="timer-screen-clip" data-timer-clip>
              <div class="timer-surface" data-timer-surface>
                <div class="timer-digits" aria-hidden="true">
                  <span class="timer-digit"><img data-timer-digit alt="" draggable="false" /></span>
                  <span class="timer-digit"><img data-timer-digit alt="" draggable="false" /></span>
                </div>
                <img class="timer-word" data-timer-word alt="" draggable="false" aria-hidden="true" />
              </div>
            </div>
            <img class="timer-glass" data-timer-glass alt="" draggable="false" />
          </div>

          <div class="timer-screen" data-timer-screen="minutes" aria-label="00 минут">
            <div class="timer-screen-clip" data-timer-clip>
              <div class="timer-surface" data-timer-surface>
                <div class="timer-digits" aria-hidden="true">
                  <span class="timer-digit"><img data-timer-digit alt="" draggable="false" /></span>
                  <span class="timer-digit"><img data-timer-digit alt="" draggable="false" /></span>
                </div>
                <img class="timer-word" data-timer-word alt="" draggable="false" aria-hidden="true" />
              </div>
            </div>
            <img class="timer-glass" data-timer-glass alt="" draggable="false" />
          </div>

          <div class="timer-glow-layer" data-timer-glow aria-hidden="true">
            <img
              class="timer-glow-image"
              data-timer-glow-image
              data-src="glow/timer-glow.webp?v=20260913c"
              alt=""
              draggable="false"
            />
            <video
              class="timer-glow-video"
              data-timer-glow-video
              data-src="glow/timer-glow.webm?v=20260913c"
              preload="none"
              autoplay
              muted
              loop
              playsinline
              webkit-playsinline
              disablepictureinpicture
            ></video>
          </div>
        </div>

        <button
          class="rsvp-cigarette"
          type="button"
          data-cigarette
          aria-label="Запустить анимацию сигареты"
        >
          <span class="rsvp-cigarette-media">
            <img
              class="rsvp-cigarette-poster"
              src="video-poster.png"
              alt=""
              draggable="false"
            />
            <img
              class="rsvp-cigarette-idle"
              data-cigarette-idle
              data-intro-src="cigarette-idle-intro.webp?v=688799a7"
              data-loop-src="cigarette-idle-preview.webp?v=7203645e"
              alt=""
              draggable="false"
            />
            <img
              class="rsvp-cigarette-animation"
              data-cigarette-image
              data-src="cigarette-animation.webp?v=01982b4d"
              alt=""
              draggable="false"
            />
            <video
              class="rsvp-cigarette-video"
              data-cigarette-video
              data-src="1%20(3)%20(2).webm?v=97704441"
              preload="none"
              muted
              playsinline
              webkit-playsinline
              disablepictureinpicture
              aria-hidden="true"
            ></video>
          </span>
        </button>

        <div class="navigation">
          <nav class="navigation-buttons" data-navigation aria-label="Основная навигация">
            <div class="navigation-track">
              <div class="nav-slot">
                <button class="nav-button" type="button" data-target="geo" aria-label="Гео" tabindex="-1">
                  <span class="nav-button-motion">
                    <span class="nav-button-sway">
                      <img class="nav-button-art" src="navigation/nav-1b-geo.png" alt="" draggable="false" />
                    </span>
                  </span>
                </button>
              </div>
              <div class="nav-slot">
                <button class="nav-button" type="button" data-target="lineup" aria-label="Лайн-ап" tabindex="-1">
                  <span class="nav-button-motion">
                    <span class="nav-button-sway nav-button-sway--reverse">
                      <img class="nav-button-art" src="navigation/nav-1b-lineup.png" alt="" draggable="false" />
                    </span>
                  </span>
                </button>
              </div>
              <div class="nav-slot">
                <button class="nav-button" type="button" data-target="home" aria-label="SHÜM — главная" aria-current="page">
                  <span class="nav-button-motion">
                    <span class="nav-button-sway">
                      <img class="nav-button-art" src="navigation/nav-1b-shum.png" alt="" draggable="false" />
                    </span>
                  </span>
                </button>
              </div>
              <div class="nav-slot">
                <button class="nav-button" type="button" data-target="rsvp" aria-label="RSVP" tabindex="-1">
                  <span class="nav-button-motion">
                    <span class="nav-button-sway nav-button-sway--reverse">
                      <img class="nav-button-art" src="navigation/nav-1b-rsvp.png" alt="" draggable="false" />
                    </span>
                  </span>
                </button>
              </div>
              <div class="nav-slot">
                <button class="nav-button" type="button" data-target="bar" aria-label="Бар" tabindex="-1">
                  <span class="nav-button-motion">
                    <span class="nav-button-sway">
                      <img class="nav-button-art" src="navigation/nav-1b-bar.png" alt="" draggable="false" />
                    </span>
                  </span>
                </button>
              </div>
            </div>
          </nav>
        </div>
      </div>
    </main>

    <script type="module" src="app.js?v=20260914carousel1"></script>
  </body>
</html>
