          rsvp: "backgrounds/rsvp.png?v=4099bfd00d",

        const requestedPage = window.location.hash.slice(1).toLowerCase();
        const initialPage = Object.prototype.hasOwnProperty.call(sources, requestedPage)
          ? requestedPage
          : "home";
        const preload = document.createElement("link");
        preload.rel = "preload";
        preload.as = "image";
        preload.href = sources[initialPage];
        preload.fetchPriority = "high";
        document.head.append(preload);

        if (initialPage === "bar") {

          underlayPreload.rel = "preload";
          underlayPreload.as = "image";
